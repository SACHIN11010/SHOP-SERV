{% extends "base.html" %}

{% block title %}Checkout - {{ super() }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Mock Payment Checkout</h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <h5>Order #{{ order.order_number }}</h5>
                        <p class="mb-0">Total Amount: ₹{{ "%.2f"|format(order.total_amount) }}</p>
                    </div>
                    
                    <p class="lead">This is a mock payment system. No real money will be charged.</p>
                    
                    <form method="POST" action="{{ url_for('mock_payment.process_payment') }}">
                        <input type="hidden" name="order_id" value="{{ order.id }}">
                        <input type="hidden" name="transaction_id" value="{{ order_data.id }}">
                        
                        <div class="form-group">
                            <label for="card_number">Card Number</label>
                            <input type="text" class="form-control" id="card_number" value="4111 1111 1111 1111" readonly>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>Expiry Date</label>
                                    <input type="text" class="form-control" value="12/30" readonly>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label>CVV</label>
                                    <input type="text" class="form-control" value="123" readonly>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Cardholder Name</label>
                            <input type="text" class="form-control" value="MOCK USER" readonly>
                        </div>
                        
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success btn-lg">
                                <i class="fas fa-credit-card"></i> Pay Now ₹{{ "%.2f"|format(order.total_amount) }}
                            </button>
                            <a href="{{ url_for('mock_payment.payment_cancel', order_id=order.id) }}" class="btn btn-outline-secondary btn-lg ml-2">
                                <i class="fas fa-times"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
