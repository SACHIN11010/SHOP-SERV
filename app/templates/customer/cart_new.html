{% extends "base.html" %}

{% block title %}Your Cart - Shop&Serv{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-8">Your Shopping Cart</h1>
    
    <div id="cart-container">
        <div class="text-center py-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
            <p>Loading your cart...</p>
        </div>
    </div>
    
    <div id="empty-cart-message" class="hidden text-center py-12">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <h3 class="mt-2 text-lg font-medium text-gray-900">Your cart is empty</h3>
        <p class="mt-1 text-gray-500">Start shopping to add items to your cart.</p>
        <div class="mt-6">
            <a href="{{ url_for('main.index') }}" class="text-blue-600 hover:text-blue-500 font-medium">
                Continue Shopping
                <span aria-hidden="true"> &rarr;</span>
            </a>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 w-80"></div>
{% endblock %}

{% block extra_js %}
<script>
// Cart functionality will be loaded here
console.log('Cart page loaded');
</script>
{% endblock %}
