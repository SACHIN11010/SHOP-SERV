{% extends "base.html" %}

{% block title %}Payment Options - Shop&Serv{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Select Payment Method</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Order #{{ order.order_number }}</h2>
            <p class="text-gray-600 mb-4">Total Amount: <span class="font-bold text-lg">₹{{ "%.2f"|format(order.total_amount) }}</span></p>
            
            <div class="border-t border-gray-200 my-6"></div>
            
            <h3 class="text-lg font-medium mb-4">Choose a payment method:</h3>
            
            <form action="{{ url_for('payment.process_payment') }}" method="POST" class="space-y-4">
                <input type="hidden" name="order_id" value="{{ order.id }}">
                
                <!-- Cash on Delivery -->
                <div class="border rounded-lg p-4 hover:border-indigo-500 transition-colors">
                    <label class="flex items-center space-x-4 cursor-pointer">
                        <input type="radio" name="payment_method" value="cod" class="h-5 w-5 text-indigo-600" checked>
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="font-medium">Cash on Delivery (COD)</span>
                                <span class="text-sm text-gray-500">Pay when you receive</span>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">Pay with cash upon delivery</p>
                        </div>
                    </label>
                </div>
                
                <!-- Card Payment -->
                <div class="border rounded-lg p-4 hover:border-indigo-500 transition-colors">
                    <label class="flex items-center space-x-4 cursor-pointer">
                        <input type="radio" name="payment_method" value="card" class="h-5 w-5 text-indigo-600">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="font-medium">Credit/Debit Card</span>
                                <div class="flex space-x-2">
                                    <img src="{{ url_for('static', filename='images/payment/visa.png') }}" alt="Visa" class="h-6">
                                    <img src="{{ url_for('static', filename='images/payment/mastercard.png') }}" alt="Mastercard" class="h-6">
                                    <img src="{{ url_for('static', filename='images/payment/rupay.png') }}" alt="RuPay" class="h-6">
                                </div>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">Pay using your credit or debit card</p>
                        </div>
                    </label>
                </div>
                
                <!-- UPI Payment -->
                <div class="border rounded-lg p-4 hover:border-indigo-500 transition-colors">
                    <label class="flex items-center space-x-4 cursor-pointer">
                        <input type="radio" name="payment_method" value="upi" class="h-5 w-5 text-indigo-600">
                        <div class="flex-1">
                            <div class="flex justify-between items-center">
                                <span class="font-medium">UPI / QR Code</span>
                                <div class="flex space-x-2">
                                    <img src="{{ url_for('static', filename='images/payment/gpay.png') }}" alt="Google Pay" class="h-6">
                                    <img src="{{ url_for('static', filename='images/payment/phonepe.png') }}" alt="PhonePe" class="h-6">
                                    <img src="{{ url_for('static', filename='images/payment/paytm.png') }}" alt="Paytm" class="h-6">
                                </div>
                            </div>
                            <p class="text-sm text-gray-500 mt-1">Pay using any UPI app or scan QR code</p>
                        </div>
                    </label>
                </div>
                
                <div class="mt-6">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-6 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                        Continue to Payment
                    </button>
                </div>
            </form>
        </div>
        
        <div class="text-center">
            <a href="{{ url_for('customer.cart') }}" class="text-indigo-600 hover:text-indigo-800">
                &larr; Back to Cart
            </a>
        </div>
    </div>
</div>
{% endblock %}
